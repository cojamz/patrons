# The play link: every push to PR #1's branch (only gate-green builds go there) builds the game and publishes it to the
# gh-pages branch, which GitHub Pages serves at https://cojamz.github.io/patrons/ (Settings → Pages → Deploy from a
# branch → gh-pages / root). Replaces the Netlify preview, whose free deploys ran out (2026-10-15).
name: play link
on:
  push:
    branches: [claude/gifted-newton-3lcy3i]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --base ./ --outDir dist-pages
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-pages
          publish_branch: gh-pages
          force_orphan: true
