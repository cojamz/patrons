<title>Patrons Rings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: the table. Concentric wheel (outer ring = round I, inner = II, center = III), quadrants run through all three rings.
   Each quadrant keeps two items on its shelf at the wheel's edge; buy one right after placing there. Single dark "table" look by choice. */
:root{
  --table:#141d1c; --table-2:#1d2928; --rim:#2d3b39; --ink:#ece6d6; --muted:#97a49f;
  --gold:#e3b23c; --black:#9c86c9; --green:#5fb37c; --yellow:#6fb3d6;
  --you:#f2efe6; --them:#e0745a;
  --display:"Marcellus", Georgia, serif; --body:"Figtree", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:radial-gradient(120% 80% at 40% 30%, var(--table-2), var(--table) 70%);color:var(--ink);font-family:var(--body);font-size:15px;padding-inline:16px;padding-block:14px;box-sizing:border-box;margin:0}
.app{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:.04em}
.status{font-size:14px;color:var(--muted)} .status b{color:var(--ink)}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{border:1px solid var(--rim);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.pl.active{box-shadow:0 0 0 1px currentColor inset;border-color:currentColor}
.pl.you{color:var(--you)} .pl.them{color:var(--them)}
.pl .name{font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.pl .name span{font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted)}
.res{display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums;color:var(--ink);font-size:14px}
.res i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.res .fav{font-weight:700}
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.stage{position:relative;width:min(100%, calc(100dvh - 200px));min-width:280px;max-width:520px;aspect-ratio:1;margin:0 auto;touch-action:none;user-select:none}
.stage svg{width:100%;height:100%;display:block;overflow:visible}
#wheel{transform-origin:200px 200px;cursor:grab}
#wheel.dragging{cursor:grabbing}
.slot{cursor:pointer} .slot.locked{cursor:default}
.spin{position:absolute;bottom:4%;width:40px;height:40px;border-radius:50%;border:1px solid var(--rim);background:var(--table);color:var(--ink);font-size:20px;cursor:pointer}
.spin.l{left:-8px}.spin.r{right:-8px}
.pointer{text-align:center;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{display:flex;flex-direction:column;gap:8px}
.panel h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel h2 small{font-family:var(--body);font-size:13px;color:var(--muted)}
.score{font-size:13px;color:var(--ink);border-left:3px solid var(--c);padding:4px 10px;background:var(--table-2);border-radius:0 8px 8px 0}
.tier{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.act{position:relative;text-align:left;border:1px solid var(--rim);background:var(--table-2);color:var(--ink);border-radius:10px;padding:9px 10px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:transform .15s,border-color .15s}
.act:hover:not(:disabled){transform:translateY(-2px);border-color:var(--c)}
.act b{font-size:14px} .act span{font-size:12.5px;color:var(--muted)}
.act:disabled{cursor:default;opacity:.5}
.act .who{position:absolute;top:8px;right:8px;width:13px;height:13px;border-radius:50%}
.market{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{position:relative;border:1px solid var(--rim);border-top:3px solid var(--c);background:var(--table-2);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.item:disabled{cursor:default;opacity:.5}
.item b{font-size:14px} .item .eff{font-size:12.5px;color:var(--muted)}
.item .row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.item .fv{font-family:var(--display);font-size:16px}
.hint{font-size:12.5px;color:var(--muted)}
.log{font-size:13px;color:var(--muted);min-height:1.4em}
.btn{align-self:flex-start;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:7px 16px;font:inherit;cursor:pointer}
@media (prefers-reduced-motion:reduce){.act{transition:none}}
</style>

<div class="app">
  <header>
    <h1>Patrons</h1>
    <div class="status" id="status"></div>
  </header>
  <div class="players" id="players"></div>

  <div class="main">
    <div>
      <div class="stage" id="stage">
        <svg viewBox="-56 -56 512 512" aria-label="Board"><g id="wheel"></g></svg>
        <button class="spin l" id="left" aria-label="Spin left">‹</button>
        <button class="spin r" id="right" aria-label="Spin right">›</button>
      </div>
      <div class="pointer">▲ your seat · drag to spin</div>
    </div>
    <div class="side">
      <section class="panel" id="tray"></section>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<script>
const GODS=[
 {id:'gold',name:'Aurum',score:'Crown — most gold at round end: +1 / +2 / +4 Favor',
  acts:[[1,'Mint','+2 gold',{gold:2}],[1,'Patron','+1 gold, +1 per use of a quadrant you pick',{gold:1}],[1,'Levy','Take 1 gold from the gold leader',{gold:1}],
        [2,'Royalties','+1 gold per item you own',{gold:'items'}],[2,'Tariff','+1 gold per quadrant you occupy',{gold:2}],
        [3,'Treasury','Double your gold',{gold:'x2'}]]},
 {id:'black',name:'Noctis',score:'Shadow — most black at round end steals 1 / 2 / 4 Favor from the leader',
  acts:[[1,'Skulk','+2 black',{black:2}],[1,'Ransack','Steal 2 resources from a player',{black:1}],[1,'Grudge','+1 black per player ahead of you',{black:1}],
        [2,'Extort','Each rival gives you 1 resource',{black:1}],[2,'Plunder','Steal half of one color',{black:2}],
        [3,'Nightfall','Take all black from every rival',{black:3}]]},
 {id:'green',name:'Chronis',score:'Echo — +1 Favor each time you repeat an action',
  acts:[[1,'Gather','+2 green',{green:2}],[1,'Relive','Repeat a space you occupy',{green:1}],[1,'Echo','Repeat a rival’s space',{green:1}],
        [2,'Rewind','Pay 2 green: repeat any ring-I space',{green:1}],[2,'Haste','+1 green, place again now',{green:1}],
        [3,'Eternity','Repeat every space you occupy',{green:3}]]},
 {id:'yellow',name:'Solara',score:'Harmony — round end: +1 Favor per full set of colors',
  acts:[[1,'Harvest','+2 yellow',{yellow:2}],[1,'Forage','+2 resources, any colors',{gold:1,green:1}],[1,'Transmute','Swap up to 3 for any colors',{yellow:1}],
        [2,'Prism','Pay 2 yellow: +1 of each other color',{gold:1,black:1,green:1,yellow:-2}],[2,'Bloom','+1 of each color you lack',{yellow:1}],
        [3,'Flourish','+2 of each color you hold',{gold:2,black:2,green:2,yellow:2}]]}
];
const ITEMS=[ // each quadrant's own deck; two sit face-up on its shelf
 [{name:'Ledger',eff:'Mint gives +3 gold',cost:{gold:2},fav:0},{name:'Signet Ring',eff:'Win Crown ties outright',cost:{gold:2},fav:1},
  {name:'Strongbox',eff:'Your gold can’t be stolen',cost:{gold:3},fav:0},{name:'Gilded Bust',eff:'A trophy',cost:{gold:4},fav:2}],
 [{name:'Veil',eff:'Ransack and Plunder can’t hit you',cost:{black:2},fav:0},{name:'Dagger',eff:'Ransack steals 3',cost:{black:2},fav:0},
  {name:'Night Mark',eff:'Win Shadow ties outright',cost:{black:3},fav:1},{name:'Raven Idol',eff:'A trophy',cost:{black:4},fav:2}],
 [{name:'Sundial',eff:'+1 green each round start',cost:{green:1},fav:0},{name:'Hourglass',eff:'Once a round, repeat a space',cost:{green:3},fav:0},
  {name:'Echo Stone',eff:'Each repeat also gives +1 any',cost:{green:2},fav:1},{name:'Chrono Seal',eff:'A trophy',cost:{green:4},fav:2}],
 [{name:'Alembic',eff:'Transmute swaps up to 5',cost:{yellow:2},fav:0},{name:'Cornucopia',eff:'+1 any each round start',cost:{yellow:3},fav:0},
  {name:'Prism Lens',eff:'Pay any item in yellow',cost:{yellow:2},fav:1},{name:'Sun Disc',eff:'A trophy',cost:{yellow:4},fav:2}]
];
let decks,shelf;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function refill(q){while(shelf[q].length<2&&decks[q].length)shelf[q].push(decks[q].shift())}
const RES=['gold','black','green','yellow'];
const RING={1:{r0:142,r1:198,r:170,n:3},2:{r0:90,r1:142,r:116,n:2},3:{r0:34,r1:90,r:62,n:1}};
const WORKERS={1:3,2:4,3:5};
const CX=200,CY=200;
let rot=0,facing=0,round,slots,players,order,turnIdx,visited,busy,pending=false;

function newGame(){
  round=1; slots=GODS.map(g=>g.acts.map(()=>null)); decks=ITEMS.map(d=>shuffle(d)); shelf=ITEMS.map(()=>[]); GODS.forEach((g,q)=>refill(q));
  players=[{name:'You',cls:'you',res:{},fav:0,left:3,items:[]},{name:'Rival',cls:'them',res:{},fav:0,left:3,items:[]}];
  players.forEach(p=>RES.forEach(r=>p.res[r]=0));
  setup={picks:[]}; order=[]; turnIdx=0; draw(); render();
  say('Setup: pick your 2 starting resources. Seat order, first to last, everyone sees.');
}
let setup=null;
function setupPick(r){
  setup.picks.push(r); players[0].res[r]++;
  if(setup.picks.length<2){render();return}
  say(`You picked ${setup.picks.join(' + ')}. Rival is choosing…`); busy=true; render();
  setTimeout(()=>{ // rival reacts to what it saw: avoids your colors when it can
    const pool=RES.filter(x=>!setup.picks.includes(x)); const pick=[pool[0]||'gold',pool[1]||pool[0]||'black'];
    pick.forEach(x=>players[1].res[x]++); busy=false;
    say(`Rival picked ${pick.join(' + ')}. Round I: only the outer ring is open.`); setup=null; startRound();
  },900);
}
function startRound(){
  const n=WORKERS[round]; players.forEach(p=>p.left=n);
  // clear workers each round so every ring re-opens
  slots=GODS.map(g=>g.acts.map(()=>null));
  order=[]; const lead=players[0].fav<=players[1].fav?0:1; // last place picks first
  for(let k=0;k<n;k++){ if(k%2===0) order.push(lead,1-lead); else order.push(1-lead,lead); }
  turnIdx=0; visited=null; busy=false; draw(); render(); maybeRival();
}
function polar(a,r){const t=(a-90)*Math.PI/180;return [CX+r*Math.cos(t),CY+r*Math.sin(t)]}
function arc(a0,a1,r0,r1){
  const [x0,y0]=polar(a0,r1),[x1,y1]=polar(a1,r1),[x2,y2]=polar(a1,r0),[x3,y3]=polar(a0,r0);
  return `M${x0},${y0} A${r1},${r1} 0 0 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 0 0 ${x3},${y3}Z`;
}
function qC(q){return 180+q*90} // q=0 starts at the bottom: your seat at the table
function color(q){return `var(--${GODS[q].id})`}

function draw(){
  let s=`<circle cx="${CX}" cy="${CY}" r="250" fill="var(--table-2)" stroke="var(--rim)" stroke-width="2"/><circle cx="${CX}" cy="${CY}" r="200" fill="none" stroke="var(--rim)" stroke-width="1.5"/>`;
  GODS.forEach((g,q)=>{
    const c=qC(q),a0=c-45,a1=c+45,f=q===facing;
    [1,2,3].forEach(t=>{
      const R=RING[t],open=t<=round;
      s+=`<path d="${arc(a0+.8,a1-.8,R.r0+1,R.r1-1)}" fill="${color(q)}" fill-opacity="${open?(f?.26:.12):.04}" stroke="${color(q)}" stroke-opacity="${open?.55:.18}"/>`;
    });
    // quadrant name along outer rim
    const [lx,ly]=polar(c,224);
    s+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="${color(q)}" font-family="Marcellus, serif" font-size="11" letter-spacing="1" transform="rotate(${c+180} ${lx} ${ly}) rotate(90 ${lx} ${ly})">${g.name.toUpperCase()}</text>`;
    // the shelf: an outer band of the wheel itself, two item cells per quadrant flanking its name
    s+=`<path d="${arc(a0+.8,a1-.8,201,247)}" fill="${color(q)}" fill-opacity="${f?.14:.07}" stroke="${color(q)}" stroke-opacity=".35"/>`;
    shelf[q].forEach((it,k)=>{
      const b0=k?c-44:c+9,b1=k?c-9:c+44,mid=(b0+b1)/2,can=q===visited&&afford(players[0],it.cost)&&!busy;
      const [x1,y1]=polar(mid,218),[x2,y2]=polar(mid,233);
      s+=`<g class="tile" data-q="${q}" data-k="${k}" style="cursor:${can?'pointer':'default'}">
        <path d="${arc(b0,b1,204,244)}" fill="${can?color(q):'var(--table)'}" fill-opacity="${can?.35:.85}" stroke="${color(q)}" stroke-width="${can?2:1}"/>
        <text x="${x1}" y="${y1}" text-anchor="middle" dominant-baseline="central" fill="var(--ink)" font-size="10" font-weight="700" transform="rotate(${mid+180} ${x1} ${y1})">${it.name}</text>
        <text x="${x2}" y="${y2}" text-anchor="middle" dominant-baseline="central" fill="${color(q)}" font-size="8.5" transform="rotate(${mid+180} ${x2} ${y2})">${Object.values(it.cost)[0]} ${GODS[q].id}${it.fav?' · +'+it.fav+'★':''}</text></g>`;
    });
    g.acts.forEach((a,i)=>{
      const t=a[0],R=RING[t],idx=g.acts.filter((x,j)=>x[0]===t&&j<i).length;
      const span=t===1?66:t===2?44:0, ang=R.n===1?c:(c+span/2)-idx*(span/(R.n-1));
      const [x,y]=polar(ang,R.r),o=slots[q][i],open=t<=round,rad=t===3?15:16;
      s+=`<g class="slot ${open?'':'locked'}" data-q="${q}" data-i="${i}">`;
      s+=`<circle cx="${x}" cy="${y}" r="${rad}" fill="var(--table)" stroke="${color(q)}" stroke-opacity="${open?1:.3}" stroke-width="1.5"/>`;
      if(o!==null) s+=`<circle cx="${x}" cy="${y}" r="${rad-5}" fill="var(--${players[o].cls})"/>`;
      else if(open) s+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" fill="${color(q)}" font-size="9" font-weight="700" transform="rotate(${ang+180} ${x} ${y})">${a[1].slice(0,4).toUpperCase()}</text>`;
      else s+=`<circle cx="${x}" cy="${y}" r="2.5" fill="${color(q)}" fill-opacity=".4"/>`;
      s+=`</g>`;
    });
  });
  const w=document.getElementById('wheel'); w.innerHTML=s; applyRot();
  w.querySelectorAll('.slot').forEach(el=>el.addEventListener('click',e=>{if(moved)return;tryPlace(+el.dataset.q,+el.dataset.i)}));
  w.querySelectorAll('.tile').forEach(el=>el.addEventListener('click',e=>{if(moved)return;buy(+el.dataset.q,+el.dataset.k)}));
}

function render(){
  const done=turnIdx>=order.length, cur=done?null:players[order[turnIdx]];
  document.getElementById('status').innerHTML=`Round <b>${['I','II','III'][round-1]}</b> · `+(pending?'<b>your buy</b>':done?'<b>round over</b>':`<b>${cur.name==='You'?'your':'rival’s'} pick</b>`);
  document.getElementById('players').innerHTML=players.map((p,k)=>`
    <div class="pl ${p.cls} ${!done&&order[turnIdx]===k?'active':''}">
      <div class="name">${p.name}<span>${'●'.repeat(p.left)} workers · ${p.items.length} items</span></div>
      <div class="res"><span class="fav">${p.fav} Favor</span>${RES.map(r=>`<span><i style="background:var(--${r})"></i>${p.res[r]}</span>`).join('')}</div>
    </div>`).join('');
  if(setup){
    document.getElementById('status').innerHTML='<b>Setup</b> · pick 2 starting resources';
    document.getElementById('tray').innerHTML=`<h2>Starting resources<small>you're first seat · ${2-setup.picks.length} left</small></h2>
      <div class="acts">${RES.map(r=>`<button class="act" style="--c:var(--${r})" data-r="${r}" ${busy||setup.picks.length>=2?'disabled':''}><b style="color:var(--${r})">${({gold:'Gold',black:'Shadow',green:'Verdant',yellow:'Sunlight'})[r]}</b><span>${GODS.find(g=>g.id===r).name}'s color</span></button>`).join('')}</div>
      <p class="hint">Going first means the others see your plan before they choose.</p>`;
    document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>setupPick(b.dataset.r));
    return;
  }
  const g=GODS[facing],myTurn=!done&&order[turnIdx]===0&&!busy;
  let h=`<h2 style="color:${color(facing)}">${g.name}<small>facing you</small></h2><div class="score" style="--c:${color(facing)}">${g.score}</div>`;
  [1,2,3].forEach(t=>{
    h+=`<div class="tier">Round ${['I','II','III'][t-1]}${t>round?' · locked':''}</div><div class="acts">`;
    g.acts.forEach((a,i)=>{ if(a[0]!==t)return; const o=slots[facing][i];
      h+=`<button class="act" style="--c:${color(facing)}" data-i="${i}" ${(o!==null||!myTurn||t>round)?'disabled':''}>${o!==null?`<i class="who" style="background:var(--${players[o].cls})"></i>`:''}<b>${a[1]}</b><span>${a[2]}</span></button>`;});
    h+=`</div>`;
  });
  h+=`<div class="tier">Shelf${visited===facing?' · buy one now':' · place here to buy'}</div><div class="market">${shelf[facing].map((it,k)=>{
    const can=visited===facing&&afford(players[0],it.cost)&&!busy;
    return `<button class="item" style="--c:${color(facing)}" data-k="${k}" ${can?'':'disabled'}><b>${it.name}</b><span class="eff">${it.eff}</span>
      <span class="row"><span>${Object.entries(it.cost).map(([r,v])=>`<i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--${r});margin-right:3px"></i>${v}`).join(' ')}</span><span class="fv">${it.fav?'+'+it.fav+' ★':''}</span></span></button>`}).join('')}</div>`;
  if(pending) h+=`<button class="btn" id="pass">Pass</button>`;
  if(done) h+= round<3?`<button class="btn" id="next">Score round, open ring ${['II','III'][round-1]}</button>`:`<button class="btn" id="next">Final scoring</button>`;
  document.getElementById('tray').innerHTML=h;
  document.querySelectorAll('.act').forEach(b=>b.onclick=()=>tryPlace(facing,+b.dataset.i));
  const nx=document.getElementById('next'); if(nx) nx.onclick=endRound;
  const ps=document.getElementById('pass'); if(ps) ps.onclick=pass;
  document.querySelectorAll('.item').forEach(b=>b.onclick=()=>buy(facing,+b.dataset.k));
}
function afford(p,c){return Object.entries(c).every(([r,v])=>p.res[r]>=v)}
function say(t){document.getElementById('log').textContent=t}

function tryPlace(q,i){
  if(busy||pending||turnIdx>=order.length||order[turnIdx]!==0)return;
  if(GODS[q].acts[i][0]>round||slots[q][i]!==null)return;
  place(0,q,i);
}
function place(pid,q,i){
  const p=players[pid],a=GODS[q].acts[i];
  slots[q][i]=pid; p.left--;
  Object.entries(a[3]).forEach(([k,v])=>{ if(v==='x2')p.res[k]*=2; else if(v==='items')p.res[k]+=p.items.length; else p.res[k]=Math.max(0,p.res[k]+v); });
  if(pid===0) visited=q;
  say(`${pid?'Rival':'You'} took ${a[1]} at ${GODS[q].name}. ${a[2]}.`);
  turnIdx++; draw(); render();
  if(pid===0&&shelf[q].some(it=>afford(p,it.cost))){say(`You took ${a[1]}. ${GODS[q].name}'s shelf is open: buy, or pass.`);pending=true;render();return}
  if(pid===1){const k=shelf[q].findIndex(it=>afford(p,it.cost));if(k>=0&&Math.random()<.6)buyFor(1,q,k)}
  maybeRival();
}
function maybeRival(){
  if(turnIdx<order.length&&order[turnIdx]===1){busy=true;render();setTimeout(()=>{
    const open=[];slots.forEach((row,q)=>row.forEach((o,i)=>{if(o===null&&GODS[q].acts[i][0]<=round)open.push([q,i])}));
    busy=false; visited=null; const [q,i]=open[Math.floor(Math.random()*open.length)]; place(1,q,i);
  },800)}
}
function buyFor(pid,q,k){
  const it=shelf[q][k],p=players[pid];
  Object.entries(it.cost).forEach(([r,v])=>p.res[r]-=v); p.fav+=it.fav; p.items.push(it.name);
  shelf[q].splice(k,1); refill(q);
  say(`${pid?'Rival':'You'} bought ${it.name} from ${GODS[q].name}${it.fav?` (+${it.fav} Favor)`:''}.`); draw(); render();
}
function buy(q,k){
  const it=shelf[q][k]; if(!it||busy||visited!==q||!afford(players[0],it.cost))return;
  visited=null; pending=false; buyFor(0,q,k); maybeRival();
}
function pass(){pending=false;visited=null;draw();render();maybeRival()}
function endRound(){
  const amt=[1,2,4][round-1], msg=[], P=players;
  const g0=P[0].res.gold,g1=P[1].res.gold;
  if(g0!==g1){const w=g0>g1?0:1;P[w].fav+=amt;msg.push(`Crown: ${w?'Rival':'You'} +${amt}`)} else if(g0>0){P.forEach(p=>p.fav+=amt);msg.push(`Crown tied: both +${amt}`)}
  const b0=P[0].res.black,b1=P[1].res.black;
  if(b0!==b1){const w=b0>b1?0:1,v=1-w;const s=Math.min(amt,P[v].fav);P[v].fav-=s;P[w].fav+=s;if(s)msg.push(`Shadow: ${w?'Rival':'You'} steal ${s}`)}
  P.forEach((p,k)=>{const sets=Math.min(...RES.map(r=>p.res[r]));if(sets){p.fav+=sets;msg.push(`Harmony: ${k?'Rival':'You'} +${sets}`)}});
  GODS.forEach((g,q)=>{if(shelf[q].length&&decks[q].length){decks[q].push(shelf[q].shift());refill(q)}}); // each shelf sheds its oldest item
  const m=msg.length?msg.join(' · '):'No one scored';
  if(round<3){round++;say(m+'. A new ring is open.');startRound();}
  else{const w=P[0].fav>=P[1].fav?'You win':'Rival wins';say(m+`. ${w}.`);render();
    document.getElementById('tray').insertAdjacentHTML('beforeend','<button class="btn" id="again">Play again</button>');document.getElementById('again').onclick=newGame;}
}
// Free spin: no snapping. The quadrant nearest the bottom is "facing you" and updates as it passes.
function applyRot(){
  wheel.style.transform=`rotate(${rot}deg)`;
  let best=0,bd=1e9;GODS.forEach((g,q)=>{const a=((qC(q)+rot-180)%360+540)%360-180;if(Math.abs(a)<bd){bd=Math.abs(a);best=q}});
  if(best!==facing){facing=best;draw();render()}
}
let anim=null;
function stopAnim(){if(anim)cancelAnimationFrame(anim);anim=null}
function nudge(deg){ // smooth eased turn from wherever it is now
  stopAnim();const from=rot,to=rot+deg,t0=performance.now(),dur=650;
  const step=n=>{const k=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-k,3);rot=from+(to-from)*e;applyRot();if(k<1)anim=requestAnimationFrame(step);else anim=null};
  anim=requestAnimationFrame(step);
}
const stage=document.getElementById('stage'),wheel=document.getElementById('wheel');
document.getElementById('left').onclick=()=>nudge(-90);
document.getElementById('right').onclick=()=>nudge(90);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')nudge(-90);if(e.key==='ArrowRight')nudge(90)});
let drag=null,moved=false;
function angAt(e){const b=stage.getBoundingClientRect();return Math.atan2(e.clientY-(b.top+b.height/2),e.clientX-(b.left+b.width/2))*180/Math.PI}
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;stopAnim();drag={a:angAt(e),r:rot,last:angAt(e),t:performance.now(),v:0};moved=false});
stage.addEventListener('pointermove',e=>{if(!drag)return;const a=angAt(e);let d=a-drag.a;if(d>180)d-=360;if(d<-180)d+=360;
  if(Math.abs(d)>3&&!moved){moved=true;wheel.classList.add('dragging');stage.setPointerCapture(e.pointerId)}
  if(moved){let da=a-drag.last;if(da>180)da-=360;if(da<-180)da+=360;const now=performance.now();drag.v=da/Math.max(1,now-drag.t)*16;drag.last=a;drag.t=now;drag.a=a;drag.r+=d;rot=drag.r;applyRot()}});
stage.addEventListener('pointerup',()=>{if(!drag)return;const v0=drag.v;drag=null;wheel.classList.remove('dragging');if(!moved)return;
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){let v=v0;const glide=()=>{v*=0.94;rot+=v;applyRot();if(Math.abs(v)>0.05)anim=requestAnimationFrame(glide);else anim=null};anim=requestAnimationFrame(glide)}
  setTimeout(()=>moved=false,0)});
newGame();
</script>
