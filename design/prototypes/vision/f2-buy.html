<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1270">
<title>Lamplit Table · Buying</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="vision.css">
<script src="px.js"></script>
<script src="board.js"></script>
<script src="scene.js"></script>
<style>
.meadow{position:absolute;left:664px;top:96px;display:grid;grid-template-columns:repeat(5,108px);gap:12px}
.lbl-shop{position:absolute;left:664px;top:70px;font-family:var(--serif);font-size:15px;color:var(--cream);display:flex;gap:10px;align-items:baseline}
.lbl-shop small{font-family:var(--sans);font-size:12px;color:var(--cream-3)}
.mine{left:664px;top:480px;width:588px;height:206px;border-radius:14px;padding:14px 16px;background:rgba(243,230,200,.05);box-shadow:inset 0 0 0 1px rgba(243,230,200,.1)}
.mine .row{display:flex;align-items:flex-end;gap:26px;margin-top:10px}
.workers{display:flex;gap:2px;align-items:flex-end}
.workers svg{filter:drop-shadow(0 4px 3px rgba(0,0,0,.5))}
.workers .used{opacity:.22}
.cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cream-3);margin-top:6px;text-align:center}
.boarddim .board{filter:brightness(.58) saturate(.7) drop-shadow(0 18px 22px rgba(0,0,0,.55)) !important}
.offer .rate.ok{border-color:rgba(255,217,154,.55);color:var(--cream);box-shadow:0 0 12px rgba(255,200,120,.18)}
.offer .rate.off{opacity:.4}
.gain{position:absolute;font-family:var(--serif);font-weight:700;font-size:13px;color:#ffd99a;white-space:nowrap}
.steps .pass::before{display:none !important}
.pass{font-family:var(--sans);font-size:12.5px;color:var(--cream-3);text-transform:none;letter-spacing:0;border-bottom:1px dotted var(--cream-3);margin-left:6px}
.steps .done{color:var(--cream-3)}
.steps .done::before{content:"✓" !important;border:none !important;width:auto !important;height:auto !important;margin-right:5px !important;color:#ffd99a}
.note.right2::before{right:-7px;top:var(--ay,40px);box-shadow:1px -1px 0 rgba(80,60,30,.25)}
.warn{color:#9a3b2a;font-weight:600}
.pay{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pay .rz{background:rgba(42,31,23,.06);border-radius:8px;padding:2px 6px}
.btnrow{margin-top:10px;display:flex;align-items:center;gap:10px}
.btn{font-family:var(--serif);font-weight:700;font-size:15px;background:#2a1f17;color:#f6eedb;border-radius:18px;padding:6px 16px}
.btnrow small{font-size:11.5px;color:var(--ink-3)}
</style>
</head>
<body>
<div class="table boarddim" id="T" style="--lx:960px;--ly:260px">
  <div class="prompt" style="left:34px;top:20px">
    <div class="big">Now <em>recruit a member,</em> or buy followers.</div>
    <div class="steps"><span class="done">Placed on Rush</span><span class="on">Recruit or buy</span><span class="pass">or pass</span></div>
  </div>
  <div class="menu"><i></i></div>
  <div class="rail" id="rail" style="right:66px;top:18px"></div>
  <div class="lbl-shop">Shop <small>4 you can afford · hover to see the cost come off your stacks</small></div>
  <div class="meadow" id="meadow"></div>
  <div class="offer" style="left:664px;top:420px"><span class="lbl" style="color:var(--cream)">Followers</span><span>for any resources</span>
    <span class="rate ok"><b>2</b>→<b>1</b></span><span class="rate ok"><b>4</b>→<b>3</b></span><span class="rate off"><b>8</b>→<b>6</b> <small>8 left</small></span><span class="rate off"><b>10</b>→<b>10</b> <small>4 left</small></span></div>
  <div class="mine">
    <div class="hd">Your table <small style="font-family:var(--sans);font-size:12px;color:var(--cream-3)">· the Star</small></div>
    <div class="row">
      <div class="stacks" id="stacks"></div>
      <div style="width:1px;align-self:stretch;background:rgba(243,230,200,.1)"></div>
      <div><div class="workers" id="workers"></div><div class="cap">1 worker left</div></div>
      <div style="width:1px;align-self:stretch;background:rgba(243,230,200,.1)"></div>
      <div><div class="hand" id="hand"></div><div class="cap" style="text-align:left">1 member</div></div>
    </div>
  </div>
</div>
<script>
const { sp, inl, SEAT, Q, CARDS, SHOP, QUADS, rail, card, stacks } = Scene;
const T = document.getElementById('T');
const quads = QUADS({ joint: SEAT.you, rush: SEAT.you, gift: SEAT.ossian, hum: SEAT.wren, pickpocket: SEAT.ilse, tipoff: SEAT.ilse });
quads[0].leader = SEAT.you; quads[1].leader = SEAT.ossian; quads[2].leader = null; quads[3].leader = SEAT.wren;
Board.render(T, { x: 344, y: 374, size: 572, round: 1, legal: false, quads });
const r = [['Wren', SEAT.wren, 2, 3, 1, 'hum'], ['Ossian', SEAT.ossian, 3, 3, 1, 'gift'], ['You', SEAT.you, 2, 3, 2, 'rush', 1], ['Ilse', SEAT.ilse, 1, 3, 2, 'tipoff']];
document.getElementById('rail').innerHTML = rail(r);
// buy phase: the lamp turns the cards to their rules side; what you can't afford goes dark and says what's missing
const state = { underdog: { cls: 'lift ok' }, seed: { cls: 'ok' }, prospector: { cls: 'ok' }, cutpurse: { cls: 'off', need: `1${inl('magenta')}`, miss: 1 },
  robin: { cls: 'off', need: `1${inl('magenta')}`, miss: 1 }, crew: { cls: 'ok' }, muse: { cls: 'off', need: `1${inl('green')}`, miss: 1 }, choir: { cls: 'off', need: `3${inl('green')}`, miss: 1 },
  retinue: { cls: 'off', need: `2${inl('silver')}`, miss: 1 }, steward: { cls: 'off', need: `2${inl('silver')}`, miss: 1 } };
document.getElementById('meadow').innerHTML = SHOP.map(id => card(id, { rules: 1, ...state[id] })).join('');
// the cost lifts off your stacks while you hover: 4 gold + any 2 (picked from what isn't winning you a contest)
document.getElementById('stacks').innerHTML = stacks([['gold', 5], ['silver', 0], ['magenta', 1], ['green', 1]], { gold: 4, magenta: 1, green: 1 });
T.insertAdjacentHTML('beforeend', `<div class="gain" style="left:880px;top:496px">+2${inl('gold')} from Rush, just now</div>`);
document.getElementById('workers').innerHTML = sp('acolyte', 3, SEAT.you) + `<span class="used">${sp('acolyte', 3, SEAT.you)}</span><span class="used">${sp('acolyte', 3, SEAT.you)}</span>`;
document.getElementById('hand').innerHTML = `<div class="mini paper" style="--q:${Q.gold};position:relative"><div class="band"></div>${sp('acolyte', 3, { robe: 'gold', prop: 'coin' })}<div class="nm">Banker</div><div style="font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:2px">Round start</div></div>`;
T.insertAdjacentHTML('beforeend', `
<div class="note paper right2" style="left:362px;top:92px;width:288px;--ay:46px">
  <div class="t">${sp('acolyte', 3, { robe: 'gold', prop: 'up' })}<h4>Underdog<small>Gold member · worth 1${inl('follower')}</small></h4></div>
  <div class="yd" style="border-top:none;padding-top:0">
    <div class="row"><span class="k">You pay</span><span class="pay"><span class="rz"><b>4</b>${sp('gold', 2)}</span><span class="rz"><b>1</b>${sp('magenta', 2)}</span><span class="rz"><b>1</b>${sp('green', 2)}</span></span></div>
    <div class="row"><span class="k"></span><span style="font-size:11.5px;color:var(--ink-3)">“any 2” taken from magenta + green. Click a stack to swap.</span></div>
    <div class="row"><span class="k">Leaves</span><span class="rz"><b>1</b>${sp('gold', 2)}</span> <span style="color:var(--ink-3)">· nothing else</span></div>
    <div class="row"><span class="k">Gold race</span><span class="warn">Ossian would lead, 2 to your 1</span></div>
  </div>
  <div class="btnrow"><span class="btn">Recruit</span><small>or click the card</small></div>
</div>`);
</script>
</body>
</html>
