<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board A · Text on the board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;600;700&display=swap">
<link rel="stylesheet" href="mock.css">
<style>
/* A — "Text on the board": every live space says what it does in glyph+number, upright, no hover needed.
   Rings that aren't open yet collapse into the hub, so round I's ring gets the whole radius (12 big cells). */
.main{display:grid;grid-template-columns:minmax(0,1fr) 560px;gap:24px;min-height:0}
.board{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0;container-type:size}
.stage{width:min(100cqw,100cqh - 26px);aspect-ratio:1;position:relative}
.stage svg{width:100%;height:100%;display:block;overflow:visible}
.side{display:flex;flex-direction:column;gap:10px;min-width:0;justify-content:flex-start;padding-top:18px}
.side .shop{grid-template-columns:repeat(3,minmax(0,1fr))}

/* wheel */
.cell{cursor:default}
.cell .bg{fill:var(--c);fill-opacity:.1;stroke:var(--c);stroke-opacity:.45;stroke-width:1.2}
.cell.can{cursor:pointer}
.cell.can .bg{fill-opacity:.15;stroke-opacity:1;stroke-width:2.2;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--c) 60%,transparent))}
.cell.can:hover .bg,.cell.sel .bg{fill-opacity:.3}
.cell.sel .bg{stroke:var(--ink);stroke-width:3}
.cell.taken .bg{fill-opacity:.04;stroke-opacity:.3}
.cell.taken .words{opacity:.38}
.cell .nm{fill:var(--c);font-weight:700;letter-spacing:.03em}
.cell .mn{fill:var(--ink);font-weight:700}
.cell .sb{fill:var(--muted);font-weight:600}
.cell .g-any{fill:none;stroke:var(--ink);stroke-width:1.6}
.cell .sock{fill:var(--table);stroke:var(--c);stroke-width:1.5}
.cell .pip{fill:var(--c);fill-opacity:.6}
.cell .who{fill:var(--table);font-weight:700}
.cell .recent{fill:none;stroke-width:2}
.band{fill:var(--c);fill-opacity:.4}
.hub .ring{fill:var(--c);fill-opacity:.05;stroke:var(--c);stroke-opacity:.18}
.hub .ghost{fill:none;stroke:var(--c);stroke-opacity:.4;stroke-dasharray:2.5 2.5}
.hub .core{fill:var(--table-2);stroke:var(--rim)}
.hub .t1{fill:var(--muted);font-family:var(--display)}
.hub .t2{fill:var(--muted)}
.hub .rn{fill:var(--muted);fill-opacity:.7;font-weight:700}

/* full wording: a docked card on laptop, a bottom sheet on phone */
.detail{border:1px solid var(--c,var(--rim));border-left-width:4px;border-radius:12px;background:var(--table-2);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-height:132px}
.detail.empty{border-style:dashed;border-left-width:1px;color:var(--muted);justify-content:center;align-items:center;text-align:center;font-size:var(--fs-2)}
.detail b{font-family:var(--display);font-weight:400;font-size:var(--fs-5);color:var(--c)}
.detail small{font-size:var(--fs-1);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.detail p{margin:2px 0;font-size:var(--fs-3);line-height:1.35}
.detail em{font-style:normal;font-size:var(--fs-2);color:var(--muted);display:flex;align-items:center;gap:6px}
.detail em i{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.detail .row{display:flex;gap:8px;margin-top:6px}
.place{border:1px solid var(--ink);background:var(--ink);color:var(--table);border-radius:999px;padding:7px 16px;font-weight:600;cursor:pointer}
.close{border:1px solid var(--rim);background:none;color:var(--muted);border-radius:999px;padding:7px 14px;cursor:pointer}
.key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--fs-2);color:var(--muted);border-top:1px dashed var(--rim);padding-top:8px}
.key b{color:var(--ink);font-weight:700}
.sheet-bg{display:none}

@media (max-width:860px){
  .main{display:flex;flex-direction:column;gap:8px}
  .board{container-type:normal}
  .stage{width:100%}
  .side{display:contents}
  .contests{order:-1}
  .board{order:0}
  .key{order:1;border:0;padding:0;justify-content:center;font-size:var(--fs-1);gap:2px 10px}
  .shop-h{order:2}.shop{order:3}.buy-note{order:4}.buy{order:5}
  .detail{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:16px 16px 0 0;border-width:1px 0 0;padding:16px 16px 24px;box-shadow:0 -12px 30px rgba(0,0,0,.5)}
  .detail.empty{display:none}
  .key .lg{display:none}
  .sheet-bg{display:block;position:fixed;inset:0;background:color-mix(in srgb,var(--table) 55%,transparent);z-index:19}
  .sheet-bg[hidden]{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar" id="bar"></header>
  <div class="strip" id="strip"></div>
  <div class="main">
    <section class="board">
      <div class="stage"><svg id="wheel" viewBox="-306 -306 612 612" role="group" aria-label="Board"></svg></div>
      <div class="legend" id="legend"></div>
    </section>
    <aside class="side">
      <div class="contests" id="contests"></div>
      <div class="sheet-bg" id="sheetbg" hidden></div>
      <div class="detail empty" id="detail">Hover or tap any space for its full wording.</div>
      <div class="key"><span><b>●</b> gem of that color</span><span><b>○</b> any color</span><span><b>2 / 4 / 6</b> grows by round</span><span><b>↺</b> copy</span><span class="lg">faded hub: rings II · III, not open yet</span></div>
      <h3 class="shop-h">Shop <small>6 face up · 61 in the pile</small></h3>
      <div class="shop" id="shop"></div>
      <p class="buy-note">Buy after you place: one member or one follower buy per turn.</p>
      <div class="buy" id="buy"></div>
    </aside>
  </div>
</div>
<div class="tag">Sketch A · text on the board</div>
<script src="mock.js"></script>
<script>
(function () {
  const svg = document.getElementById('wheel');
  const detail = document.getElementById('detail');
  const sheetbg = document.getElementById('sheetbg');
  const phone = () => matchMedia('(max-width:860px)').matches;
  let sel = (location.hash.match(/sel=(\d-\d)/) || [])[1] || null;
  let placed = null;

  const R0 = 112, R1 = 300;          // round I ring gets the radius
  const SPANS = { 1: 60, 2: 44, 3: 0 };
  const SOCK_R = 141, TEXT_R = 224;  // disc toward the hub, words out where the cell is widest

  function glyph(s) {
    return M.esc(s).split(/(\{\w+\})/).filter(Boolean).map(t => {
      const m = t.match(/^\{(\w+)\}$/);
      if (!m) return `<tspan>${t}</tspan>`;
      return m[1] === 'any' ? '<tspan class="g-any">●</tspan>' : `<tspan style="fill:var(--${m[1]})">●</tspan>`;
    }).join('');
  }

  function render() {
    const P = phone();
    const fs = P ? { nm: 18, mn: 26, sb: 15, who: 0, hub1: 24, hub2: 15, rn: 15 } : { nm: 14.5, mn: 23, sb: 14, who: 11, hub1: 19, hub2: 12.5, rn: 12 };
    const out = [];
    out.push(`<circle r="304" fill="var(--table-2)" stroke="var(--rim)" stroke-width="2"/>`);
    // hub: rings II and III, collapsed and faded
    const hub = ['<g class="hub">'];
    M.quadrants.forEach(Q => {
      const c = Q.center;
      hub.push(`<path class="ring" style="--c:${Q.c}" d="${M.sector(c - 44.3, c + 44.3, 84, 106)}"/>`);
      hub.push(`<path class="ring" style="--c:${Q.c}" d="${M.sector(c - 44.3, c + 44.3, 60, 82)}"/>`);
      Q.actions.forEach((a, i) => {
        if (a.ring === 1) return;
        const [x, y] = M.polar(M.angleOf(M.quadrants.indexOf(Q), a, i, SPANS), a.ring === 2 ? 95 : 71);
        hub.push(`<circle class="ghost" style="--c:${Q.c}" cx="${x}" cy="${y}" r="6"/>`);
      });
    });
    hub.push(`<circle class="core" r="57"/>`);
    hub.push(`<text class="t1" y="${-fs.hub2 * 0.55}" text-anchor="middle" dominant-baseline="central" font-size="${fs.hub1}">II · III</text>`);
    hub.push(`<text class="t2" y="${fs.hub1 * 0.62}" text-anchor="middle" dominant-baseline="central" font-size="${fs.hub2}">open later</text>`);
    [[2, 95], [3, 71]].forEach(([t, r]) => { const [x, y] = M.polar(-45, r); hub.push(`<text class="rn" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${fs.rn}">${M.roman(t)}</text>`); });
    hub.push('</g>');
    out.push(hub.join(''));

    M.quadrants.forEach((Q, q) => {
      // a thin band on the rim: this quadrant pays out at round end
      out.push(`<path class="band" style="--c:${Q.c}" d="${M.sector(Q.center - 44.4, Q.center + 44.4, R1 - 5, R1 - 1)}"/>`);
      Q.actions.forEach((a, i) => {
        if (a.ring !== 1) return;
        const key = M.key(q, i);
        const ang = M.angleOf(q, a, i, SPANS);
        const owner = placed === key ? 0 : M.slots[key];
        const taken = owner !== undefined;
        const can = !taken && placed === null;
        const cls = ['cell', can ? 'can' : '', taken ? 'taken' : '', sel === key ? 'sel' : ''].join(' ');
        const g = [`<g class="${cls}" data-key="${key}" style="--c:${Q.c}" role="button" tabindex="${can ? 0 : -1}" aria-label="${M.esc(a.name)}: ${M.esc(a.text)}">`];
        g.push(`<path class="bg" d="${M.sector(ang - 14.4, ang + 14.4, R0, R1)}"/>`);
        const [sx, sy] = M.polar(ang, SOCK_R);
        if (taken) {
          const p = M.player(owner);
          const recent = M.recent.find(r => r[0] === key);
          if (recent) g.push(`<circle class="recent" cx="${sx}" cy="${sy}" r="21" style="stroke:${p.pc}"/>`);
          g.push(`<circle cx="${sx}" cy="${sy}" r="15" fill="${p.pc}"/>`);
          if (fs.who) g.push(`<text class="who" x="${sx}" y="${sy + 0.5}" text-anchor="middle" dominant-baseline="central" font-size="${fs.who}">${p.me ? 'you' : p.name}</text>`);
        } else {
          g.push(`<circle class="sock" cx="${sx}" cy="${sy}" r="15"/><circle class="pip" cx="${sx}" cy="${sy}" r="3"/>`);
        }
        const [tx, ty] = M.polar(ang, TEXT_R);
        const nm = P && a.short ? a.short : a.name;
        const lines = [['nm', fs.nm, M.esc(nm)], ['mn', fs.mn, glyph(a.main)]];
        if (a.sub) lines.push(['sb', fs.sb, glyph(a.sub)]);
        const gap = 1.22;
        const total = lines.reduce((s, l) => s + l[1] * gap, 0);
        let y = ty - total / 2;
        g.push('<g class="words">');
        lines.forEach(([c, f, html]) => {
          g.push(`<text class="${c}" x="${tx}" y="${y + (f * gap) / 2}" text-anchor="middle" dominant-baseline="central" font-size="${f}">${html}</text>`);
          y += f * gap;
        });
        g.push('</g></g>');
        out.push(g.join(''));
      });
    });
    svg.innerHTML = out.join('');
    showDetail(sel);
  }

  function showDetail(key) {
    if (!key) { detail.className = 'detail empty'; detail.removeAttribute('style'); detail.innerHTML = 'Hover or tap any space for its full wording.'; sheetbg.hidden = true; return; }
    const [q, i] = key.split('-').map(Number);
    const Q = M.quadrants[q], a = Q.actions[i];
    const owner = placed === key ? 0 : M.slots[key];
    const can = owner === undefined && placed === null;
    const p = owner !== undefined ? M.player(owner) : null;
    detail.className = 'detail';
    detail.style.setProperty('--c', Q.c);
    detail.innerHTML = `<b>${a.name}</b><small>${Q.name} · round ${M.roman(a.ring)}</small><p>${a.text}</p>
      <em>${p ? `<i style="--pc:${p.pc}"></i>Taken by ${p.me ? 'you' : p.name}` : 'Open: yours to take'}</em>
      <div class="row">${can ? `<button class="place" data-place="${key}">Place here</button>` : ''}${phone() ? '<button class="close">Close</button>' : ''}</div>`;
    sheetbg.hidden = !phone();
  }

  svg.addEventListener('pointerover', e => {
    if (e.pointerType !== 'mouse' || sel) return;
    const c = e.target.closest('.cell'); if (c) showDetail(c.dataset.key);
  });
  svg.addEventListener('pointerout', e => { if (e.pointerType === 'mouse' && !sel && !e.relatedTarget?.closest?.('.cell')) showDetail(null); });
  svg.addEventListener('click', e => {
    const c = e.target.closest('.cell'); if (!c) return;
    const k = c.dataset.key;
    if (sel === k && c.classList.contains('can')) { place(k); return; } // second tap places
    sel = k; render();
  });
  document.addEventListener('click', e => {
    if (e.target.matches('.place')) place(e.target.dataset.place);
    if (e.target.matches('.close') || e.target === sheetbg) { sel = null; render(); }
  });
  function place(k) { placed = k; sel = null; document.querySelector('.say').lastChild.textContent = 'Placed. Buy one thing, or pass'; render(); }

  M.renderBar(document.getElementById('bar'), 'Your turn: tap a lit space');
  M.renderStrip(document.getElementById('strip'));
  M.renderContests(document.getElementById('contests'));
  M.renderLegend(document.getElementById('legend'));
  M.renderShop(document.getElementById('shop'));
  M.renderBuy(document.getElementById('buy'));
  render();
  matchMedia('(max-width:860px)').addEventListener('change', render);
})();
</script>
</body>
</html>
